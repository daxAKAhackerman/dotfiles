# Enable RGB colour if running in xterm# Enable RGB colour if running in xterm(1)
set-option -sa terminal-features ",xterm*:RGB"

# Change the default $TERM to tmux-256color
set -g default-terminal "tmux-256color"

# No bells at all
set -g bell-action none

# Change the prefix key to C-a
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Turn the mouse on, but without copy mode dragging
set -g mouse on

set -s set-clipboard on

bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection
bind -T copy-mode-vi y send -X copy-selection

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi Escape send -X cancel

# Splits open in same path
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Keys to toggle monitoring activity in a window and the synchronize-panes option
bind m set monitor-activity
bind y set synchronize-panes\; display 'synchronize-panes #{?synchronize-panes,on,off}'

bind -n M-z resize-pane -Z

bind Space {
  if -F '#{==:#{window_panes},2}' {
    if -F '#{==:#{pane_width},#{window_width}}' {
      select-layout even-horizontal
    } {
      select-layout even-vertical
    }
  } {
    if -F '#{==:#{window_panes},3}' {
      select-layout main-horizontal-mirrored
      swap-pane -t '{top-left}'
      select-pane -t '{top-left}'
    } {
      next-layout
    }
  }
}

setw -g mode-keys vi

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'janoamaral/tokyo-night-tmux'
set -g @plugin 'smart-splits-nvim/backend-tmux'

set -g @smart-splits_move_left_key  'M-Left'
set -g @smart-splits_move_up_key    'M-Up'
set -g @smart-splits_move_right_key 'M-Right'
set -g @smart-splits_move_down_key  'M-Down'

run '~/.tmux/plugins/tpm/tpm'
